<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  
  <!-- POS Register Terminal Base -->
  <rect x="80" y="320" width="352" height="96" rx="28" fill="#FFFFFF" fill-opacity="0.95"/>
  <rect x="110" y="356" width="160" height="24" rx="8" fill="#10B981" fill-opacity="0.3"/>
  <circle cx="370" cy="368" r="14" fill="#047857"/>

  <!-- Screen Stand -->
  <path d="M220 270 L292 270 L308 320 L204 320 Z" fill="#0F172A" fill-opacity="0.6"/>

  <!-- Screen Monitor -->
  <rect x="100" y="96" width="312" height="200" rx="24" fill="url(#screenGrad)" stroke="#FFFFFF" stroke-width="8"/>
  
  <!-- Barcode on Screen -->
  <g fill="#10B981">
    <rect x="144" y="140" width="10" height="70" rx="3"/>
    <rect x="162" y="140" width="18" height="70" rx="3"/>
    <rect x="190" y="140" width="8" height="70" rx="3"/>
    <rect x="208" y="140" width="22" height="70" rx="3"/>
    <rect x="240" y="140" width="12" height="70" rx="3"/>
    <rect x="262" y="140" width="26" height="70" rx="3"/>
    <rect x="298" y="140" width="10" height="70" rx="3"/>
    <rect x="318" y="140" width="20" height="70" rx="3"/>
    <rect x="348" y="140" width="14" height="70" rx="3"/>
  </g>
  
  <!-- Scan Light -->
  <line x1="124" y1="175" x2="388" y2="175" stroke="#F43F5E" stroke-width="6" stroke-linecap="round"/>

  <!-- Text / Brand KADI POS -->
  <text x="256" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">KADI POS</text>
</svg>
